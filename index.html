atio:1;border-radius:50%;background:radial-gradient(circle at 35% 25%,#eaffff,#66cfee);border:4px solid white;box-shadow:0 4px #1c8cb7}.tools{position:absolute;z-index:9;right:2%;bottom:3%;display:flex;gap:.5%;width:55%;justify-content:flex-end}.tool{width:16%;max-width:105px;min-height:clamp(65px,8vw,100px);border:4px solid #f2d8a6;border-radius:17px;background:#fffdf5;color:#275470;font-size:clamp(11px,1.15vw,16px);font-weight:1000;box-shadow:0 4px #caa879}.tool i{display:block;font-size:clamp(23px,2.6vw,37px);font-style:normal}.tool.active{border-color:#23a6e7;background:#dcf7ff;transform:translateY(-4px)}.modal{position:absolute;z-index:20;inset:0;display:none;place-items:center;background:#163c5fab}.modal.show{display:grid}.card{width:min(680px,76%);border:5px solid white;border-radius:29px;background:var(--cream);padding:3%;text-align:center;box-shadow:0 16px 45px #102c4788}.card h1,.card h2{margin:.15em;color:#216895;font-size:clamp(25px,3.4vw,46px)}.card p{font-weight:800;font-size:clamp(15px,1.55vw,22px);line-height:1.6}.rolePick{display:flex;gap:3%;justify-content:center}.rolePick button{width:43%;min-height:150px;border:4px solid white;border-radius:22px;color:#fff;background:linear-gradient(135deg,#69cdec,#2e86c2);font-size:clamp(18px,2.2vw,30px);font-weight:1000;text-shadow:0 2px #1b557d}.rolePick button:last-child{background:linear-gradient(135deg,#ffb1bc,#eb6e85)}.rolePick i{font-style:normal;font-size:clamp(48px,6vw,80px);display:block}.primary{border:0;border-radius:15px;background:linear-gradient(#ffe57d,#ffc348);box-shadow:0 4px #c98527;padding:.5em 1.2em;color:#6a4812;font-size:clamp(16px,1.8vw,24px);font-weight:1000}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}.choices button{border:3px solid #c6e6ef;border-radius:12px;background:#f5fdff;padding:9px;color:#234b66;font-weight:850}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}.product{border:3px solid #c9e8ed;border-radius:14px;padding:8px;background:#f3fcff;font-size:12px}.product strong{display:block;color:#176a99;font-size:15px}.product button{margin-top:5px;border:0;border-radius:8px;padding:5px;background:#ffcf59;font-weight:1000}@keyframes pulse{50%{scale:1.03}}@media(orientation:portrait){.game{display:none}.rotate{display:grid!important;height:100dvh;place-items:center;text-align:center;padding:20px;background:#55bce8;color:white;font-size:clamp(25px,7vw,42px);font-weight:1000;line-height:1.6}}.rotate{display:none}
.zone{border:0!important;outline:2px solid #935aa77a;outline-offset:1px;background:#d89ae018!important;box-shadow:none!important}.zone::after{top:-.2em;background:#fffdf6ed;border-color:#6fc7ec;opacity:.82}.zone.near{animation:none!important;outline:4px solid #b2579a;outline-offset:1px;background:#e9a6dd38!important}.zone.near::before{display:none!important}.zone.done::before{display:none}.zone.done::after{content:'✓ 已完成';opacity:1}.zone.done{outline:2px solid #58b98888!important;background:#8ce1ae18!important}.zoneCount{position:absolute;z-index:4;right:1%;top:2%;min-width:1.55em;height:1.55em;padding:0 .22em;display:grid;place-items:center;border:2px solid white;border-radius:50%;background:#ff6770;color:white;font-size:clamp(11px,1.15vw,17px);font-weight:1000;box-shadow:0 2px 3px #83464b88}.zone.done .zoneCount{background:#55c98d}.player{width:clamp(53px,6vw,90px)!important;height:clamp(70px,9vw,125px)!important;aspect-ratio:auto!important;background-image:url('assets/cleaning-captains.png');background-repeat:no-repeat;background-size:200% 100%;background-position:left center;filter:drop-shadow(0 4px 3px #315b6d88)!important}.player.girl{background-position:right center}.player .head,.player .body,.player .toolIcon{display:none}.remaining{color:#e84b4f;font-size:clamp(20px,2.4vw,34px)}
.top{height:10%;gap:clamp(4px,.7vw,10px);padding:.7% 1.5%;white-space:nowrap}.logo{width:clamp(205px,23vw,285px);flex:0 1 auto;font-size:clamp(15px,1.65vw,25px);line-height:1.1;padding:.32em .5em}.badge,.top button{font-size:clamp(10px,1.1vw,16px);padding:.34em .52em}.topTasks{color:#265777}.topTasks strong{color:#e64e51;font-size:1.35em}.role{display:flex;align-items:center;gap:.35em}.avatar{display:inline-block;width:1.7em;height:1.7em;border-radius:50%;background-image:url('assets/cleaning-captains.png');background-repeat:no-repeat;background-size:200% 100%;background-position:left center;border:2px solid white;vertical-align:middle}.avatar.girl{background-position:right center}.status{height:7%;padding:.45% 3%;gap:.8%}.statusBox{border-width:3px;border-radius:15px;padding:.25% .8%;display:flex;align-items:center;gap:.45em;line-height:1}.statusBox:nth-child(2){display:block}.statusBox small{font-size:clamp(9px,1vw,14px)}.timer{font-size:clamp(21px,2.5vw,34px)}.bar{height:9px;margin-top:2px}.primary{font-size:clamp(12px,1.25vw,18px);padding:.35em .7em;box-shadow:0 3px #c98527}.stage{top:17%}.hint{bottom:clamp(72px,8vw,105px);z-index:10;max-width:48%;overflow:hidden;text-overflow:ellipsis}.tools{right:1.5%;bottom:1.5%;width:min(51%,570px);gap:5px}.tool{min-height:clamp(48px,5.7vw,66px);padding:2px;border-width:3px;border-radius:13px}.tool i{font-size:clamp(18px,1.9vw,28px)}.joystick{left:2%;bottom:1.5%;width:clamp(85px,10vw,135px)}.rolePick button{position:relative;min-height:165px;padding-top:105px;background-image:linear-gradient(135deg,#69cdec88,#2e86c288),url('assets/cleaning-captains.png');background-size:100% 100%,200% 100%;background-position:center,left center}.rolePick button:last-child{background-image:linear-gradient(135deg,#ffb1bc88,#eb6e8588),url('assets/cleaning-captains.png');background-size:100% 100%,200% 100%;background-position:center,right center}.rolePick i{display:none}.sink1{left:9%;top:35%;width:8%;height:13%}.sink2{left:17%;top:35%;width:8%; <body>
<main class="game">
  <header class="top"><div class="logo"><span>🧹</span> 校園廁所清潔挑戰</div><div class="badge role" id="roleName">清潔隊長</div><div class="badge">★ Lv.1　第 <span id="day">1</span> 天</div><div class="badge">🪙 <strong id="coins">0</strong></div><div class="badge topTasks">⭐ 還有 <strong id="topRemaining">17</strong> 項</div><div class="grow"></div><button onclick="openShop()">🏪 商店升級</button><button onclick="restart()">↻ 重新開始</button></header>
  <section class="status"><div class="statusBox">⏱ <b id="time" class="timer">01:30</b></div><div class="statusBox">🫧 潔淨度 <span id="clean">0</span>%<div class="bar"><i id="bar"></i></div><small id="task">請先選擇角色，開始今天的打掃</small></div><div class="statusBox"><small id="progress">已完成 0／17</small><button class="primary" onclick="startDay()">開始今天 ▶</button></div></section>
  <section class="stage" id="stage">
    <button class="zone mirror" data-zone="mirror" data-name="長方形鏡子"><b class="zoneCount">1</b></button><button class="zone sink1" data-zone="sink1" data-name="高水龍頭 1"><b class="zoneCount">1</b></button><button class="zone sink2" data-zone="sink2" data-name="高水龍頭 2"><b class="zoneCount">1</b></button><button class="zone sink3" data-zone="sink3" data-name="矮水龍頭"><b class="zoneCount">1</b></button><button class="zone mopslot" data-zone="mopslot" data-name="拖把槽"><b class="zoneCount">1</b></button><button class="zone urinal1" data-zone="urinal1" data-name="小便斗 1"><b class="zoneCount">3</b></button><button class="zone urinal2" data-zone="urinal2" data-name="小便斗 2"><b class="zoneCount">3</b></button><button class="zone urinal3" data-zone="urinal3" data-name="小便斗 3"><b class="zoneCount">3</b></button><button class="zone squat1" data-zone="squat1" data-name="蹲式廁所 1"><b class="zoneCount">4</b></button><button class="zone squat2" data-zone="squat2" data-name="蹲式廁所 2"><b class="zoneCount">4</b></button><button class="zone squat3" data-zone="squat3" data-name="蹲式廁所 3"><b class="zoneCount">4</b></button><button class="zone squat4" data-zone="squat4" data-name="蹲式廁所 4"><b class="zoneCount">4</b></button><button class="zone squat5" data-zone="squat5" data-name="蹲式廁所 5"><b class="zoneCount">4</b></button><button class="zone squat6" data-zone="squat6" data-name="蹲式廁所 6"><b class="zoneCount">4</b></button><button class="zone sit" data-zone="sit" data-name="坐式廁所"><b class="zoneCount">4</b></button><button class="zone paper" data-zone="paper" data-name="走道紙屑"><b class="zoneCount">1</b></button><button class="zone puddle" data-zone="puddle" data-name="地面水漬"><b class="zoneCount">1</b></button><button class="zone closet" data-zone="closet" data-name="確認掃具整齊"></button>
    <div class="player girl" id="player"><div class="head"><div class="hair"></div></div><div class="body"></div><span class="toolIcon" id="toolIcon">🧽</span></div>
    <div class="hint" id="hint">選工具 → 用左下搖桿走近發亮區域 → 點區域清潔</div>
    <div class="joystick" id="joystick"><div class="joyKnob" id="knob"></div></div><div class="tools" id="tools"></div>
  </section>
  <section class="modal show" id="roleModal"><article class="card"><h1>選擇清潔隊長</h1><p>先選主角，再用搖桿走進廁所完成今天的清潔任務。</p><div class="rolePick"><button onclick="chooseRole('boy')"><i>👦</i>男生隊長<br><small>負責男廁</small></button><button onclick="chooseRole('girl')"><i>👧</i>女生隊長<br><small>負責女廁</small></button></div></article></section>
  <section class="modal" id="tutorialModal"><article class="card"><h2>開始前練習</h2><p>掃地和拖地要在方框內左右往返滑動。先在下方練習 <b>4 次</b>！</p><div class="swipeTrack" id="tutorialTrack"><i class="swipeDot"></i></div><div class="swipeCount" id="tutorialCount">0 / 4</div><p id="tutorialTip">手指由左滑到右，再由右滑回左。</p></article></section>
  <section class="modal" id="swipeModal"><article class="card"><h2 id="swipeTitle">掃地任務</h2><p id="swipeText">請在區域內左右往返滑動，完成清潔。</p><div class="swipeTrack" id="swipeTrack"><i class="swipeDot"></i></div><div class="swipeCount" id="swipeCount">0 / 4</div></article></section>
  <section class="modal" id="eventModal"><article class="card"><div id="eventIcon" style="font-size:55px">💦</div><h2 id="eventTitle">衛教判斷題</h2><p id="eventQuestion"></p><div class="choices" id="choices"></div></article></section>
  <section class="modal" id="resultModal"><article class="card"><h2 id="resultTitle">今日評分</h2><div id="stars" style="font-size:clamp(35px,6vw,70px);color:#e9a126"></div><p id="resultText"></p><button class="primary" onclick="closeResult()">再來一天</button></article></section>
  <section class="modal" id="shopModal"><article class="card"><h2>商店升級</h2><p>金幣：🪙 <span id="shopCoins">0</span></p><div class="shop" id="shopItems"></div><br><button class="primary" onclick="closeShop()">回到遊戲</button></article></section>
</main><div class="rotate">請將 iPad 橫放<br>開始校園清潔挑戰</div>
<script>
const $=id=>document.getElementById(id);
const tools=[['brush','🪥','刷子'],['picker','🗜️','夾子'],['cloth','🧽','抹布'],['broom','🧹','掃把'],['mop','🧼','海綿拖把'],['flush','🚿','沖水']];
const defaults={coins:0,day:1,up:{cleaner:0,mop:0,broadcast:0,auto:0,sound:0,decor:0}};
let s=JSON.parse(localStorage.cleanGameV2||'null')||structuredClone(defaults),hero='',selected='cloth',running=false,paused=false,time=90,timer,px=49,py=72,vx=0,vy=0,raf,events=0,closetConfirmed=false,earlyCloset=false,lastTool='',toolStreak=0,practiceDone=false,swipeJob=null,swipeNeeded=4,swipeCount=0,lastSwipeDirection=0,autoToilets=[],soundToilets=[];Object.assign(s.up,defaults.up,s.up);const toiletIds=['squat1','squat2','squat3','squat4','squat5','squat6','sit'];
let tasks={mirror:['cloth'],sink1:['brush'],sink2:['brush'],sink3:['brush'],mopslot:['brush'],urinal1:['brush','flush','cloth'],urinal2:['brush','flush','cloth'],urinal3:['brush','flush','cloth'],squat1:['brush','flush','picker','cloth'],squat2:['brush','flush','picker','cloth'],squat3:['brush','flush','picker','cloth'],squat4:['brush','flush','picker','cloth'],squat5:['brush','flush','picker','cloth'],squat6:['brush','flush','picker','cloth'],sit:['brush','flush','picker','cloth'],paper:['sweep'],puddle:['mopSwipe']};
function save(){localStorage.cleanGameV2=JSON.stringify(s);$('coins').textContent=s.coins;$('day').textContent=s.day}
function buildTools(){$('tools').innerHTML=tools.map(t=>`<button class="tool ${t[0]===selected?'active':''}" data-tool="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{selected=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));$('toolIcon').textContent=tools.find(t=>t[0]===selected)[1];$('hint').textContent='工具已選好，用搖桿靠近發亮區域後點一下清潔。'})}
function chooseRole(r){hero=r;$('roleModal').classList.remove('show');$('roleName').innerHTML=`<span class="avatar ${r==='girl'?'girl':''}"></span>${r==='boy'?'男生隊長':'女生隊長'}｜友善廁所`;$('player').className='player '+r;document.querySelectorAll('.urinal1,.urinal2,.urinal3').forEach(x=>x.style.display='block');save();render()}
function resetTasks(){tasks={mirror:['cloth'],sink1:['brush'],sink2:['brush'],sink3:['brush'],mopslot:['brush'],urinal1:['brush','flush','cloth'],urinal2:['brush','flush','cloth'],urinal3:['brush','flush','cloth'],squat1:['brush','flush','picker','cloth'],squat2:['brush','flush','picker','cloth'],squat3:['brush','flush','picker','cloth'],squat4:['brush','flush','picker','cloth'],squat5:['brush','flush','picker','cloth'],squat6:['brush','flush','picker','cloth'],sit:['brush','flush','picker','cloth'],paper:['sweep'],puddle:['mopSwipe']};autoToilets=toiletIds.slice(0,Math.min(7,s.up.auto));soundToilets=toiletIds.slice(0,Math.min(7,s.up.sound));autoToilets.forEach(id=>tasks[id]=tasks[id].filter(x=>x!=='flush'))}
function startDay(){if(!hero){$('roleModal').classList.add('show');return}if(!practiceDone){showTutorial();return}beginDay()}
function beginDay(){clearInterval(timer);resetTasks();running=true;paused=false;time=90+Math.min(3,s.up.cleaner);events=0;closetConfirmed=false;earlyCloset=false;lastTool='';toolStreak=0;document.querySelector('.closet').classList.remove('done');timer=setInterval(tick,1000);$('task').textContent=`第 ${s.day} 天｜完成 17 項工作後，最後再整理掃具`;$('hint').textContent=`任務開始！同一工具連續完成 3 次工作，可加 2 秒。${s.up.cleaner?' 強效清潔劑已加 '+s.up.cleaner+' 秒。':''}`;render()}
function tick(){if(!running||paused)return;time--;let goal=s.day===1?1:s.day===2?2:s.day===3?3:3+Math.floor(Math.random()*3);if(events<goal&&time===Math.max(15,90-(events+1)*Math.floor(75/(goal+1))))showEvent();if(time<=0)finish();render()}
function move(){if(!running){raf=requestAnimationFrame(move);return}px=Math.max(4,Math.min(96,px+vx));py=Math.max(7,Math.min(90,py+vy));$('player').style.left=px+'%';$('player').style.top=py+'%';updateNear();raf=requestAnimationFrame(move)}
function center(el){let r=el.getBoundingClientRect(),a=$('stage').getBoundingClientRect();return{x:(r.left+r.width/2-a.left)/a.width*100,y:(r.top+r.height/2-a.top)/a.height*100}}
function updateNear(){document.querySelectorAll('.zone').forEach(z=>{if(z.classList.contains('done')||z.style.display==='none')return;let r=z.getBoundingClientRect(),a=$('stage').getBoundingClientRect(),left=(r.left-a.left)/a.width*100,right=(r.right-a.left)/a.width*100,top=(r.top-a.top)/a.height*100,bottom=(r.bottom-a.top)/a.height*100;let dx=Math.max(left-px,0,px-right),dy=Math.max(top-py,0,py-bottom),near=Math.hypot(dx,dy)<6;z.classList.toggle('near',near)})}
function cleanZone(z){if(!running||paused)return;let id=z.dataset.zone;if(!z.classList.contains('near')){$('hint').textContent='還沒走近這個方框，請用左下搖桿靠近；走近後方框內任一位置都能點選。';return}if(id==='closet'){if(doneCount()<totalCount()){earlyCloset=true;z.classList.add('done');$('hint').textContent='你太早整理掃具了！掃具要最後才能排整齊；今天結算會扣 5 金幣。';return}closetConfirmed=true;z.classList.add('done');$('hint').textContent='掃具整齊歸位！17 項工作全部完成，獲得滿分！';render();finish();return}let need=tasks[id];if(!need||!need.length)return;let required=need[0];if(required==='sweep'||required==='mopSwipe'){let tool=required==='sweep'?'broom':'mop';if(selected!==tool){$('hint').textContent=`這裡要使用「${tools.find(t=>t[0]===tool)[2]}」，再左右往返滑動。`;return}startSwipe(id,required==='mopSwipe'?'mop':'broom');return}if(selected!==required){$('hint').textContent=`這裡先需要「${tools.find(t=>t[0]===required)[2]}」，請在右下工具列更換。`;return}completeWork(id,selected)}
function completeWork(id,tool){tasks[id].shift();if(lastTool===tool)toolStreak++;else{lastTool=tool;toolStreak=1}let bonus='';if(tool==='flush'&&soundToilets.includes(id))coinSound();if(tool==='brush'&&autoToilets.includes(id)&&soundToilets.includes(id)){coinSound();bonus+=' 自動沖水金幣音效響起！'}if(toolStreak%3===0){time=Math.min(93,time+2);bonus+=' 連續使用同工具 3 次，+2 秒！'}$('hint').textContent=`完成「${tools.find(t=>t[0]===tool)[2]}」！連續 ${toolStreak} 次。${bonus}`;render();if(doneCount()===totalCount()){if(earlyCloset){$('hint').textContent='17 項清潔工作完成，但掃具太早整理；今天會扣 5 金幣。';finish()}else $('hint').textContent='17 項工作都完成了！請走到掃具間，最後點選「確認掃具整齊」。'}}
function showTutorial(){swipeCount=0;lastSwipeDirection=0;$('tutorialCount').textContent='0 / 4';$('tutorialTip').textContent='手指由左滑到右，再由右滑回左。';$('tutorialModal').classList.add('show')}
function startSwipe(id,type){swipeJob={id,type};swipeCount=0;lastSwipeDirection=0;swipeNeeded=type==='mop'?Math.max(1,4-Math.min(3,s.up.mop)):4;$('swipeTitle').textContent=type==='mop'?'拖地任務':'掃地任務';$('swipeText').textContent=type==='mop'?`用海綿拖把左右往返滑動 ${swipeNeeded} 次。好神拖已減少 ${Math.min(3,s.up.mop)} 次。`:`用掃把左右往返滑動 ${swipeNeeded} 次。`;$('swipeCount').textContent=`0 / ${swipeNeeded}`;$('swipeModal').classList.add('show')}
function recordSwipe(direction,isTutorial){if(direction===lastSwipeDirection)return;lastSwipeDirection=direction;swipeCount++;if(isTutorial){$('tutorialCount').textContent=`${swipeCount} / 4`;if(swipeCount>=4){practiceDone=true;$('tutorialTip').textContent='練習完成！現在開始今天的清潔任務。';setTimeout(()=>{$('tutorialModal').classList.remove('show');beginDay()},500)}}else{$('swipeCount').textContent=`${swipeCount} / ${swipeNeeded}`;if(swipeCount>=swipeNeeded){let id=swipeJob.id,tool=swipeJob.type;$('swipeModal').classList.remove('show');completeWork(id,tool)}}}
function bindSwipe(track,isTutorial){let dot=track.querySelector('.swipeDot'),lastX=0,dragging=false;function stop(){dragging=false;dot.style.left='50%'}dot.addEventListener('pointerdown',e=>{lastX=e.clientX;dragging=true;dot.setPointerCapture(e.pointerId);e.preventDefault()});dot.addEventListener('pointermove',e=>{if(!dragging)return;let r=track.getBoundingClientRect(),x=Math.max(12,Math.min(r.width-12,e.clientX-r.left));dot.style.left=(x/r.width*100)+'%';let dx=e.clientX-lastX;if(Math.abs(dx)>=22){recordSwipe(Math.sign(dx),isTutorial);lastX=e.clientX}});dot.addEventListener('pointerup',stop);dot.addEventListener('pointercancel',stop)}
function doneCount(){return Object.values(tasks).filter(x=>x.length===0).length}function totalCount(){return Object.keys(tasks).length}
function render(){let done=doneCount(),total=totalCount(),clean=Math.round(done/total*100),remain=total-done;$('time').textContent=`${String(Math.max(0,Math.floor(time/60))).padStart(2,'0')}:${String(Math.max(0,time%60)).padStart(2,'0')}`;$('clean').textContent=clean;$('bar').style.width=clean+'%';$('topRemaining').textContent=remain;$('progress').textContent=`已完成 ${done}／${total}`;Object.entries(tasks).forEach(([id,a])=>{let z=document.querySelector(`[data-zone="${id}"]`);if(z){z.classList.toggle('done',a.length===0);let badge=z.querySelector('.zoneCount');if(badge)badge.textContent=a.length}})}
function showEvent(){paused=true;events++;let bank=hero==='boy'?[['💦','尿尿沒有對準','看到小便沒有對準小便斗，應該怎麼做？',['對準小便斗，弄濕地面立即清理','只沖小便斗，地面水漬先不處理','快速離開現場，請別人幫忙清理','用腳把水推開，讓它自然變乾']],['🧻','小便斗被丟垃圾','發現衛生紙被丟進小便斗，應該怎麼做？',['用夾子取出，再丟進垃圾桶裡','按很多次沖水，讓紙屑自己流走','再放些衛生紙，讓小便斗更滿','用手直接挖出，不需要任何工具']],['🚿','使用後忘記沖水','看到有人使用後忘記沖水，應該怎麼做？',['提醒使用者沖水，確認設備乾淨','直接離開，等下一位同學處理','只擦地板，不處理馬桶內部','把門關起來，假裝沒有看見'],true]]:[['🩹','衛生棉沒有包好','看到衛生棉沒有包好就丟垃圾桶，應該怎麼做？',['用衛生紙包好，再丟進垃圾桶裡','直接沖進馬桶，讓水把它帶走','留在地上，等清潔人員來發現','貼在牆壁上，讓下一位同學處理']],['🚽','馬桶堵塞警報','衛生棉被丟進馬桶造成堵塞，應該怎麼做？',['停止沖水，通知老師或清潔人員','連續按沖水，讓堵塞物趕快沖走','再丟衛生紙，幫忙吸走馬桶積水','離開不處理，等下一位同學使用']],['🚿','使用後忘記沖水','看到有人使用後忘記沖水，應該怎麼做？',['提醒使用者沖水，確認設備乾淨','直接離開，等下一位同學處理','只擦地板，不處理馬桶內部','把門關起來，假裝沒有看見'],true]];let weighted=[];bank.forEach(x=>{for(let i=0;i<(x[4]&&s.up.broadcast?1:3);i++)weighted.push(x)});let e=weighted[Math.floor(Math.random()*weighted.length)];$('eventIcon').textContent=e[0];$('eventTitle').textContent=e[1];$('eventQuestion').textContent=e[2];let order=e[3].map((x,i)=>[x,i]).sort(()=>Math.random()-.5);$('choices').innerHTML=order.map(([x,i])=>`<button onclick="answer(${i})">${x}</button>`).join('');$('eventModal').classList.add('show')}
function answer(i){if(i===0){$('eventQuestion').textContent='答對了！記住：安全、衛生、負責任，才是正確處理方式。';$('choices').innerHTML='<button class="primary" onclick="closeEvent()">繼續打掃</button>'}else $('eventQuestion').textContent='再想一想：哪一個方法能安全、衛生地解決問題？'}function closeEvent(){paused=false;$('eventModal').classList.remove('show')}
function finish(){if(!running)return;running=false;clearInterval(timer);let clean=Math.round(doneCount()/totalCount()*100),score=Math.min(100,clean+s.up.decor*3);if(clean===100&&!closetConfirmed)score=Math.min(score,95);if(earlyCloset)score=Math.min(score,95);let star=score>=94?5:score>=78?4:score>=60?3:score>=38?2:1,reward=Math.max(0,star*8-(earlyCloset?5:0));s.coins+=reward;save();$('resultTitle').textContent=`今日評分：${score} 分`;$('stars').textContent='★'.repeat(star)+'☆'.repeat(5-star);$('resultText').textContent=earlyCloset?`獲得 ${reward} 金幣（已扣 5 金幣）。提醒：掃具要最後才能排整齊，才能得到完整獎勵！`:closetConfirmed&&clean===100?`獲得 ${reward} 金幣。17 項清潔工作完成，掃具也在最後整齊歸位，滿分！`:`獲得 ${reward} 金幣。下次記得完成 17 項工作後，最後再確認掃具整齊。`;$('resultModal').classList.add('show')}
function closeResult(){$('resultModal').classList.remove('show');s.day++;resetTasks();save();render()}
function openShop(){let goods=[['cleaner','強效清潔劑','Lv.1–3：每級開局 +1 秒',12,3],['mop','好神拖','Lv.1–3：每級少滑動 1 次',14,3],['broadcast','廣播設備','Lv.1：略降忘記沖水事件機率',18,1],['auto','自動沖水','Lv.1–7：每級自動沖 1 間',16,7],['sound','沖水金幣音效','Lv.1–7：每級支援 1 間沖水音效',10,7],['decor','校園裝飾','Lv.1–3：每級每日評分 +3 分',9,3]];$('shopCoins').textContent=s.coins;$('shopItems').innerHTML=goods.map(g=>{let maxed=s.up[g[0]]>=g[4];return `<div class="product"><strong>${g[1]}</strong>${g[2]}<br>等級 ${s.up[g[0]]}／${g[4]}<br><button ${maxed?'disabled':''} onclick="buy('${g[0]}',${g[3]},${g[4]})">${maxed?'已升滿':'🪙 '+g[3]}</button></div>`}).join('');$('shopModal').classList.add('show')}function buy(id,c,max){if(s.coins<c||s.up[id]>=max)return;s.coins-=c;s.up[id]++;save();openShop()}function closeShop(){$('shopModal').classList.remove('show')}
function coinSound(){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(880,a.currentTime);o.frequency.exponentialRampToValueAtTime(1560,a.currentTime+.12);g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.26);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.26)}catch(e){}}
function restart(){if(!confirm('要回到第 1 天並清除商店升級嗎？'))return;localStorage.removeItem('cleanGameV2');s=structuredClone(defaults);hero='';practiceDone=false;running=false;clearInterval(timer);save();$('roleModal').classList.add('show');render()}
function setupJoy(){let joy=$('joystick'),knob=$('knob');function set(e){let r=joy.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2),m=Math.min(1,Math.hypot(x,y));if(m){x=x/m*Math.min(m,1);y=y/m*Math.min(m,1)}vx=x*.38;vy=y*.38;knob.style.left=(50+x*26)+'%';knob.style.top=(50+y*26)+'%'}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);set(e)};joy.onpointermove=e=>{if(e.buttons)set(e)};joy.onpointerup=()=>{vx=vy=0;knob.style.left='50%';knob.style.top='50%'}}
document.querySelectorAll('.zone').forEach(z=>z.onclick=()=>cleanZone(z));window.addEventListener('keydown',e=>{let d={ArrowLeft:[-.35,0],ArrowRight:[.35,0],ArrowUp:[0,-.35],ArrowDown:[0,.35]}[e.key];if(d){vx=d[0];vy=d[1]}});window.addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))vx=vy=0});bindSwipe($('tutorialTrack'),true);bindSwipe($('swipeTrack'),false);buildTools();setupJoy();save();render();move();
