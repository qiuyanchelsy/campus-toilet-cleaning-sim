<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>校園廁所清潔大作戰</title><style>
:root{--ink:#23405c;--blue:#49b9e8;--deep:#2874a9;--mint:#55c99b;--yellow:#ffd764;--pink:#ff8b89;--paper:#fffdf5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#bdeeff,#fff3c7);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;touch-action:manipulation}.app{max-width:1280px;margin:auto;padding:12px}.head{display:flex;align-items:center;gap:12px;background:#ffffffde;border:3px solid white;border-radius:22px;padding:10px 16px;box-shadow:0 8px 20px #2e6b8522}.logo{width:55px;height:55px;border-radius:18px;background:var(--yellow);display:grid;place-items:center;font-size:33px;box-shadow:inset 0 -5px #e6b636}h1{font-size:clamp(20px,3vw,32px);margin:0;color:#176394}.sub{font-size:13px;color:#56748a}.spacer{flex:1}.coin{font-weight:1000;background:#fff3ba;border-radius:99px;padding:8px 12px}.topbtn,.start,.shopBtn{border:0;border-radius:13px;padding:9px 13px;background:var(--deep);color:white;font-weight:900;box-shadow:0 3px 0 #18507a}.topbtn:active,.start:active,.shopBtn:active{translate:0 2px;box-shadow:0 1px 0 #18507a}.hud{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin:12px 0}.panel{background:#ffffffde;border:3px solid white;border-radius:18px;padding:9px 12px;box-shadow:0 6px 15px #28627c20;font-weight:850}.time{font-size:clamp(19px,3vw,29px);color:#d84b5c}.meter{height:12px;background:#dfeef2;border-radius:99px;overflow:hidden;margin-top:5px}.meter b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9b7e,#ffd764,#55c99b);transition:width .3s}.toolbar{display:flex;gap:7px;overflow:auto;padding:2px}.tool{min-width:94px;border:3px solid #d1e8ef;border-radius:16px;background:#fff;padding:7px 5px;font-weight:900;color:#315a73}.tool i{display:block;font-size:26px;font-style:normal}.tool.active{background:#d9f7ff;border-color:var(--blue);transform:translateY(-2px)}.map{position:relative;background:linear-gradient(90deg,#c8f5f5 0 28%,#fff7e6 28% 65%,#e9e1ff 65%);border:5px solid white;border-radius:25px;min-height:610px;padding:20px;display:grid;grid-template-columns:1.1fr 1.5fr 1.65fr;gap:18px;box-shadow:0 12px 24px #245e7629}.zone{position:relative;border:4px solid #fff;border-radius:22px;padding:12px;background:#ffffff85;box-shadow:inset 0 0 0 2px #93d4df55}.zone h2{font-size:clamp(15px,1.7vw,21px);margin:0 0 8px;color:#185c80}.sinkRow,.urinalRow,.toiletGrid{display:grid;gap:8px}.sinkRow{grid-template-columns:repeat(3,1fr)}.urinalRow{grid-template-columns:repeat(3,1fr)}.toiletGrid{grid-template-columns:repeat(2,1fr)}.target{position:relative;min-height:71px;border:3px solid #cce4ea;border-radius:14px;background:#fff;text-align:center;padding:5px;font-weight:900;color:#325b70;transition:.15s}.target:hover{border-color:var(--blue);transform:translateY(-2px)}.target.done{background:#ddfae9;border-color:#54c494}.target.warn{animation:warn 1s infinite;border-color:#ff8c74}.target .art{font-size:27px;line-height:1}.target small{display:block;font-size:11px}.badge{position:absolute;right:3px;top:3px;background:var(--pink);color:white;border-radius:99px;padding:1px 6px;font-size:11px}.mirror{height:88px;background:linear-gradient(135deg,#e4fbff,#9edbea);border:7px solid #d6b87c;border-radius:12px;display:grid;place-items:center;font-size:35px;margin-bottom:8px}.mopslot{margin-top:9px}.floor{grid-column:1/-1;min-height:90px;background:repeating-linear-gradient(45deg,#d6f0ff 0 14px,#eaf9ff 14px 28px);border:4px dashed #91cfe1;border-radius:19px;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.closet{position:absolute;bottom:18px;left:50%;translate:-50%;width:210px;min-height:78px;background:#b48257;border:5px solid #8a6040;border-radius:13px;color:#fff;padding:9px;text-align:center;font-weight:1000;box-shadow:0 5px #6f4a32}.closet.done{background:#58bd8d;border-color:#368968}.closet button{margin-top:5px;border:0;border-radius:9px;padding:5px 8px;font-weight:900}.tip{margin:12px 0;background:#fff2bd;border-radius:15px;padding:9px 13px;font-weight:850}.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#173d5fa8;padding:18px}.modal.show{display:grid}.modalCard{width:min(650px,96vw);background:var(--paper);border:5px solid white;border-radius:28px;padding:24px;text-align:center;box-shadow:0 18px 40px #102e4c77}.modalCard h2{margin:4px;font-size:clamp(25px,4vw,40px);color:#1f6695}.eventIcon{font-size:64px}.modalCard p{font-size:clamp(16px,2vw,22px);font-weight:850;line-height:1.6}.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:left}.product{border:3px solid #cbe5ed;border-radius:15px;padding:9px;background:#f5fdff;font-size:13px}.product strong{display:block;color:#1c6794;font-size:16px}.product button{margin-top:7px;border:0;border-radius:9px;background:#ffca4c;padding:5px 7px;font-weight:1000}.product button:disabled{opacity:.5}.stars{font-size:clamp(32px,5vw,60px);color:#e69d24}@keyframes warn{50%{scale:1.04}}@media(max-width:850px){.map{grid-template-columns:1fr;min-height:0}.closet{position:relative;left:auto;bottom:auto;translate:0;margin:8px auto}.hud{grid-template-columns:1fr 1fr}.hud .panel:nth-child(2){grid-column:1/-1;order:-1}.floor{grid-column:auto}}@media(orientation:portrait) and (max-width:700px){.app{padding:7px}.map{padding:9px;gap:9px}.target{min-height:58px}.tool{min-width:80px}}
</style></head><body><main class="app"><header class="head"><div class="logo">🫧</div><div><h1>校園廁所清潔大作戰</h1><div class="sub">90 秒衛教模擬經營｜先選工具，再點需要處理的地方</div></div><div class="spacer"></div><span class="coin">🪙 <span id="coins">0</span></span><button class="topbtn" onclick="openShop()">商店升級</button></header><section class="hud"><div class="panel">剩餘時間<br><span id="time" class="time">01:30</span></div><div class="panel">今日潔淨度：<span id="clean">0</span>%<div class="meter"><b id="cleanbar"></b></div><div id="taskText">點「開始今天」開始任務</div></div><div class="panel">本日進度<br><span id="progress">0 / 0</span><br><button class="start" onclick="startDay()">開始今天</button></div></section><section class="toolbar" id="toolbar"></section><div class="tip" id="tip">工具提示：選擇工具後，點選對應區域；使用錯工具不會扣分，但會提醒你換一個方法。</div><section class="map" id="map"><div class="zone"><h2>洗手台區</h2><button class="target mirror" data-id="mirror"><span class="badge">0</span>🪞<small>長方形鏡子</small></button><div class="sinkRow" id="sinks"></div><button class="target mopslot" data-id="mopslot"><span class="badge">0</span><span class="art">🪣</span><small>拖把槽</small></button></div><div class="zone"><h2>小便斗區</h2><div class="urinalRow" id="urinals"></div><div class="floor"><button class="target" data-id="papers"><span class="badge">0</span><span class="art">📄</span><small>走道紙屑</small></button><button class="target" data-id="puddle"><span class="badge">0</span><span class="art">💧</span><small>地面水漬</small></button></div></div><div class="zone"><h2>廁間區</h2><div class="toiletGrid" id="toilets"></div></div><aside class="closet" id="closet">掃具間<br><small>所有工作完成後，將掃具排整齊</small><br><button onclick="tidyCloset()">確認掃具整齊</button></aside></section></main><div class="modal" id="eventModal"><article class="modalCard"><div class="eventIcon" id="eventIcon"></div><h2 id="eventTitle"></h2><p id="eventText"></p><button class="start" onclick="closeEvent()">我知道了，繼續打掃</button></article></div><div class="modal" id="shopModal"><article class="modalCard"><h2>清潔升級商店</h2><p>現有金幣：🪙 <span id="shopCoins">0</span></p><div class="shopgrid" id="shopgrid"></div><br><button class="topbtn" onclick="closeShop()">回到遊戲</button></article></div><div class="modal" id="resultModal"><article class="modalCard"><h2 id="resultTitle">今日評分</h2><div class="stars" id="stars"></div><p id="resultText"></p><button class="start" onclick="closeResult()">再來一天</button></article></div><script>
const toolData=[['brush','🪥','刷子','刷洗洗手台、小便斗、馬桶'],['picker','🗜️','夾子','夾走垃圾'],['cloth','🧽','抹布','擦鏡子、擦灰塵'],['broom','🧹','掃把','掃走紙屑'],['mop','🧼','海綿拖把','拖乾地面水漬'],['flush','🚿','沖水手勢','沖洗馬桶、小便斗']];let selected='brush',state={coins:+localStorage.toiletCoins||0,up:JSON.parse(localStorage.toiletUp||'{"cleaner":0,"mop":0,"broadcast":0,"auto":0,"sound":0,"art":0}'),active:false,paused:false,time:90,timer:null,nextEvent:22,items:{},closet:false};const $=x=>document.getElementById(x);const taskNames={brush:'刷洗',picker:'夾垃圾',cloth:'擦拭',broom:'掃紙屑',mop:'拖水漬',flush:'沖水'};function save(){localStorage.toiletCoins=state.coins;localStorage.toiletUp=JSON.stringify(state.up);$('coins').textContent=state.coins}function build(){toolData.forEach(t=>{let b=document.createElement('button');b.className='tool '+(t[0]===selected?'active':'');b.dataset.tool=t[0];b.innerHTML=`<i>${t[1]}</i>${t[2]}`;b.onclick=()=>{selected=t[0];document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x.dataset.tool===selected));$('tip').textContent=`已選「${t[2]}」：${t[3]}`};$('toolbar').append(b)});for(let i=1;i<=3;i++)$('sinks').insertAdjacentHTML('beforeend',`<button class="target" data-id="sink${i}"><span class="badge">0</span><span class="art">🚰</span><small>${i===3?'矮水龍頭':'高水龍頭'}洗手台</small></button>`);for(let i=1;i<=3;i++)$('urinals').insertAdjacentHTML('beforeend',`<button class="target" data-id="urinal${i}"><span class="badge">0</span><span class="art">🚽</span><small>小便斗 ${i}</small></button>`);for(let i=1;i<=7;i++)$('toilets').insertAdjacentHTML('beforeend',`<button class="target" data-id="toilet${i}"><span class="badge">0</span><span class="art">${i===7?'🚽':'🚻'}</span><small>${i===7?'坐式廁所':'蹲式廁所 '+i}</small></button>`);document.querySelectorAll('.target').forEach(b=>b.onclick=()=>clean(b.dataset.id));save()}function baseItems(){let o={mirror:['cloth'],mopslot:['brush'],papers:['broom'],puddle:['mop']};for(let i=1;i<=3;i++)o['sink'+i]=['brush'];for(let i=1;i<=3;i++)o['urinal'+i]=['brush','flush','cloth'];for(let i=1;i<=7;i++)o['toilet'+i]=state.up.auto>=i?['brush','picker','cloth']:['brush','flush','picker','cloth'];return o}function startDay(){clearInterval(state.timer);state.active=true;state.paused=false;state.time=90;state.nextEvent=22;state.items=baseItems();state.closet=false;document.querySelectorAll('.target').forEach(b=>b.classList.remove('done','warn'));render();state.timer=setInterval(tick,1000);$('tip').textContent='任務開始！快速切換適合的工具。'}function tick(){if(!state.active||state.paused)return;state.time--;if(state.time===state.nextEvent){state.nextEvent-=25;triggerEvent()}if(state.time<=0)endDay();render()}function clean(id){if(!state.active||state.paused)return;let needs=state.items[id];if(!needs||!needs.length){$('tip').textContent='這裡已經處理完成，去找其他任務吧！';return}if(needs[0]!==selected){$('tip').textContent=`這裡要先用「${taskNames[needs[0]]}」，換工具再試試。`;return}needs.shift();if(state.up.cleaner&&selected==='brush'&&needs[0]==='brush')needs.shift();if(state.up.mop&&selected==='mop')needs.splice(0,1);if(state.up.sound)coinSound();$('tip').textContent=`完成「${taskNames[selected]}」！`;render();if(doneCount()===totalCount()&&!state.closet)$('tip').textContent='所有區域完成！最後請到掃具間確認掃具排整齊。'}function tidyCloset(){if(!state.active)return;if(doneCount()<totalCount()){$('tip').textContent='還有工作沒完成，請先完成全部清潔任務。';return}state.closet=true;$('closet').classList.add('done');$('tip').textContent='掃具整齊歸位！今天提早完成。';endDay()}function doneCount(){return Object.values(state.items).filter(a=>a.length===0).length}function totalCount(){return Object.keys(state.items).length}function render(){let sec=Math.max(0,state.time),clean=Math.round((doneCount()/Math.max(1,totalCount()))*100);$('time').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;$('clean').textContent=clean;$('cleanbar').style.width=clean+'%';$('progress').textContent=`${doneCount()} / ${totalCount()}`;$('taskText').textContent=state.active?`完成 ${doneCount()} 區；剩餘 ${sec} 秒`:'準備開始今天的打掃';Object.entries(state.items).forEach(([id,a])=>{let b=document.querySelector(`[data-id="${id}"]`);if(!b)return;b.querySelector('.badge').textContent=a.length;b.classList.toggle('done',a.length===0);b.classList.toggle('warn',a.length>2)})}function triggerEvent(){let events=[['💩','沒有對準','大便尿尿要對準，保持馬桶周圍乾淨。','toilet1','brush'],['🩹','衛生棉處理不當','衛生棉要包好丟垃圾桶，不可貼牆上。','toilet2','picker'],['🍞','食物垃圾出現','馬桶只吃排泄物，食物垃圾不可丟廁所垃圾桶。','papers','broom'],['💦','廁所安全提醒','不可甩水滑倒、不可玩掃具與門鎖。','puddle','mop']];let e=events[Math.floor(Math.random()*events.length)];if(state.up.broadcast&&Math.random()<.65){$('tip').textContent='廣播設備提醒同學遵守規則，成功避免違規事件！';return}state.paused=true;state.items[e[3]].unshift(e[4]);$('eventIcon').textContent=e[0];$('eventTitle').textContent=e[1];$('eventText').textContent=e[2];$('eventModal').classList.add('show');render()}function closeEvent(){state.paused=false;$('eventModal').classList.remove('show');$('tip').textContent='衛教標語已閱讀，繼續完成新增的清潔任務！'}function endDay(){if(!state.active)return;state.active=false;clearInterval(state.timer);let clean=Math.round(doneCount()/Math.max(1,totalCount())*100),bonus=state.up.art*3,score=Math.min(100,clean+bonus),stars=score>=94?5:score>=78?4:score>=60?3:score>=38?2:1,reward=stars*8+(state.closet?6:0);state.coins+=reward;save();$('resultTitle').textContent=`今日評分：${score} 分`;$('stars').textContent='★'.repeat(stars)+'☆'.repeat(5-stars);$('resultText').textContent=`獲得 🪙 ${reward} 金幣。${state.closet?'掃具也整齊歸位，獲得加分！':'下次別忘了掃具間也要整理。'} 先升級裝備，再挑戰更高分吧！`;$('resultModal').classList.add('show')}function closeResult(){$('resultModal').classList.remove('show');render()}function openShop(){$('shopCoins').textContent=state.coins;let p=[['cleaner','強效清潔劑','刷洗一次可多完成一項','12'],['mop','好神拖','拖地可加快處理','14'],['broadcast','廣播設備','降低違規事件機率','18'],['auto','自動沖水','每次升級 1 間，共 7 間','16'],['sound','沖水金幣音效','Web Audio 合成叮噹聲','10'],['art','裝飾品','名畫、植物、香氛，評分 +3%','9']];$('shopgrid').innerHTML=p.map(x=>{let lv=state.up[x[0]],max=x[0]==='auto'?7:1,can=lv<max&&state.coins>=+x[3];return `<div class="product"><strong>${x[1]}</strong>${x[2]}<br>目前 ${lv}/${max}<br><button ${can?'':'disabled'} onclick="buy('${x[0]}',${x[3]})">🪙 ${x[3]} 購買</button></div>`}).join('');$('shopModal').classList.add('show')}function closeShop(){$('shopModal').classList.remove('show')}function buy(id,cost){if(state.coins<cost)return;state.coins-=cost;state.up[id]++;save();openShop()}function coinSound(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1760,c.currentTime+.12);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}}build();
/* 角色選擇與男女廁差異化 */
let hero='';
function roleSetup(){let style=document.createElement('style');style.textContent='.roleChip{display:none;align-items:center;gap:6px;background:#e1f7ff;border:3px solid #fff;border-radius:15px;padding:5px 9px;font-size:13px;font-weight:1000;color:#176394}.rolePick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:15px 0}.rolePick button{border:4px solid #d0eaf1;border-radius:20px;background:#f4fdff;padding:16px;color:#224b67;font-weight:1000;font-size:18px}.rolePick button:hover{border-color:#43b7e8;background:#dff7ff}.rolePick i{display:block;font-size:54px;font-style:normal}';document.head.append(style);document.querySelector('.head').insertAdjacentHTML('afterbegin','<div class="roleChip" id="roleChip"></div>');document.body.insertAdjacentHTML('beforeend','<div class="modal show" id="roleModal"><article class="modalCard"><div class="eventIcon">🧼</div><h2>選擇今天的清潔主角</h2><p>男生主角負責男廁；女生主角負責女廁。不同廁所配置與突發事件會跟著改變！</p><div class="rolePick"><button onclick="chooseHero(\'boy\')"><i>👦</i>男生主角<br><small>負責男廁｜3 座小便斗</small></button><button onclick="chooseHero(\'girl\')"><i>👧</i>女生主角<br><small>負責女廁｜全隔間廁所</small></button></div></article></div>')}
function chooseHero(type){hero=type;state.hero=type;let ur=$('urinals'),to=$('toilets'),mid=document.querySelectorAll('.zone h2')[1];ur.innerHTML='';to.innerHTML='';if(type==='boy'){mid.textContent='小便斗區';for(let i=1;i<=3;i++)ur.insertAdjacentHTML('beforeend',`<button class="target" data-id="urinal${i}"><span class="badge">0</span><span class="art">🚽</span><small>小便斗 ${i}</small></button>`);for(let i=1;i<=7;i++)to.insertAdjacentHTML('beforeend',`<button class="target" data-id="toilet${i}"><span class="badge">0</span><span class="art">${i===7?'🚽':'🚻'}</span><small>${i===7?'坐式廁所':'蹲式廁所 '+i}</small></button>`)}else{mid.textContent='女廁隔間區';for(let i=1;i<=3;i++)ur.insertAdjacentHTML('beforeend',`<button class="target" data-id="toilet${i+7}"><span class="badge">0</span><span class="art">🚻</span><small>蹲式廁所 ${i+7}</small></button>`);for(let i=1;i<=7;i++)to.insertAdjacentHTML('beforeend',`<button class="target" data-id="toilet${i}"><span class="badge">0</span><span class="art">${i===7?'🚽':'🚻'}</span><small>${i===7?'坐式廁所':'蹲式廁所 '+i}</small></button>`)}document.querySelectorAll('.target').forEach(b=>b.onclick=()=>clean(b.dataset.id));$('roleChip').style.display='flex';$('roleChip').innerHTML=type==='boy'?'👦 男生主角｜男廁':'👧 女生主角｜女廁';$('roleModal').classList.remove('show');$('tip').textContent=type==='boy'?'男廁已配置完成：別忘了小便斗也需要刷洗、沖水、擦拭。':'女廁已配置完成：每一間隔間都要刷洗、沖水、夾垃圾與擦灰塵。'}
function baseItems(){let o={mirror:['cloth'],mopslot:['brush'],papers:['broom'],puddle:['mop']};for(let i=1;i<=3;i++)o['sink'+i]=['brush'];if(hero==='boy')for(let i=1;i<=3;i++)o['urinal'+i]=['brush','flush','cloth'];let total=hero==='girl'?10:7;for(let i=1;i<=total;i++)o['toilet'+i]=state.up.auto>=i?['brush','picker','cloth']:['brush','flush','picker','cloth'];return o}
